<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayurveda Vaidya</title>
<style>
/* ======= CSS Reset & Variables ======= */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --saffron: #D4882B;
  --saffron-light: #E8A848;
  --gold: #C9A84C;
  --earth: #8B6F47;
  --earth-dark: #5C4A32;
  --sage: #7A8B6F;
  --cream: #FAF5ED;
  --warm-white: #FFF8F0;
  --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  --transition: 0.2s ease;
  --radius: 12px;
  --radius-sm: 8px;
  --sidebar-width: 280px;
}

/* Dark theme */
[data-theme="dark"] {
  --bg-primary: #1A1A1A;
  --bg-secondary: #242424;
  --bg-tertiary: #2D2D2D;
  --bg-hover: #363636;
  --bg-user-msg: #3A2E1A;
  --bg-asst-msg: #2D2D2D;
  --text-primary: #ECECEC;
  --text-secondary: #A0A0A0;
  --text-muted: #6B6B6B;
  --border: #3A3A3A;
  --border-light: #444;
  --input-bg: #2D2D2D;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --scrollbar-thumb: #444;
  --code-bg: #1E1E1E;
}

/* Light theme */
[data-theme="light"] {
  --bg-primary: #FFFFFF;
  --bg-secondary: #F7F3ED;
  --bg-tertiary: #EDE8E0;
  --bg-hover: #E8E2D8;
  --bg-user-msg: #F5EDE0;
  --bg-asst-msg: #FFFFFF;
  --text-primary: #2C2C2C;
  --text-secondary: #666;
  --text-muted: #999;
  --border: #E0D8CC;
  --border-light: #EAE4DA;
  --input-bg: #FFFFFF;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --scrollbar-thumb: #CCC;
  --code-bg: #F5F0E8;
}

html, body {
  height: 100%;
  font-family: var(--font-main);
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow: hidden;
}

/* ======= Layout ======= */
.app {
  display: flex;
  height: 100vh;
  width: 100vw;
}

/* ======= Sidebar ======= */
.sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: transform var(--transition);
  z-index: 100;
}

.sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.brand-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, var(--saffron), var(--gold));
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.brand-text {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.2;
}

.brand-sub {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 400;
}

.new-chat-btn {
  width: 100%;
  padding: 10px 14px;
  border: 1px dashed var(--border);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-primary);
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all var(--transition);
}

.new-chat-btn:hover {
  background: var(--bg-hover);
  border-color: var(--saffron);
  color: var(--saffron);
}

/* Quick Actions */
.sidebar-section {
  padding: 14px 16px 8px;
}

.sidebar-section-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 8px;
  font-weight: 600;
}

.quick-action {
  width: 100%;
  padding: 9px 12px;
  border: none;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all var(--transition);
  text-align: left;
  margin-bottom: 2px;
}

.quick-action:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.quick-action-icon {
  font-size: 15px;
  width: 22px;
  text-align: center;
  flex-shrink: 0;
}

/* Dosha Panel */
.dosha-panel {
  margin-top: auto;
  padding: 16px;
  border-top: 1px solid var(--border);
}

.dosha-panel-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 10px;
  font-weight: 600;
}

.dosha-bar-group {
  margin-bottom: 8px;
}

.dosha-bar-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin-bottom: 3px;
}

.dosha-bar-name {
  color: var(--text-secondary);
  font-weight: 500;
}

.dosha-bar-value {
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.dosha-bar-track {
  height: 6px;
  border-radius: 3px;
  background: var(--bg-hover);
  overflow: hidden;
}

.dosha-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.6s ease;
}

.dosha-bar-fill.vata { background: linear-gradient(90deg, #7B9EC7, #5A7FA8); }
.dosha-bar-fill.pitta { background: linear-gradient(90deg, #D4882B, #C46A1A); }
.dosha-bar-fill.kapha { background: linear-gradient(90deg, #7A8B6F, #5D6E52); }

.dosha-dominant {
  margin-top: 10px;
  text-align: center;
  font-size: 12px;
  color: var(--saffron);
  font-weight: 500;
  min-height: 18px;
}

/* Theme toggle & sidebar footer */
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.theme-toggle {
  background: none;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px;
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all var(--transition);
}

.theme-toggle:hover {
  border-color: var(--saffron);
  color: var(--saffron);
}

/* ======= Main Chat ======= */
.chat-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
}

/* Mobile menu button */
.mobile-menu-btn {
  display: none;
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 50;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  color: var(--text-primary);
  font-size: 16px;
  cursor: pointer;
}

/* Chat messages area */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 0;
  scroll-behavior: smooth;
}

.chat-messages::-webkit-scrollbar { width: 6px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

.messages-container {
  max-width: 768px;
  margin: 0 auto;
  padding: 24px 20px 120px;
}

/* Welcome screen */
.welcome-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px 40px;
  text-align: center;
}

.welcome-icon {
  width: 64px;
  height: 64px;
  background: linear-gradient(135deg, var(--saffron), var(--gold));
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(212, 136, 43, 0.3);
}

.welcome-title {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 8px;
  color: var(--text-primary);
}

.welcome-sub {
  font-size: 14px;
  color: var(--text-secondary);
  max-width: 440px;
  line-height: 1.5;
  margin-bottom: 28px;
}

.welcome-suggestions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  max-width: 500px;
  width: 100%;
}

.suggestion-btn {
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-secondary);
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  text-align: left;
  line-height: 1.4;
  transition: all var(--transition);
}

.suggestion-btn:hover {
  border-color: var(--saffron);
  color: var(--text-primary);
  background: var(--bg-hover);
}

/* Message bubbles */
.message-row {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message-row.user {
  flex-direction: row-reverse;
}

.message-avatar {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  margin-top: 2px;
}

.message-row.assistant .message-avatar {
  background: linear-gradient(135deg, var(--saffron), var(--gold));
}

.message-row.user .message-avatar {
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
}

.message-content {
  max-width: 85%;
  min-width: 0;
}

.message-name {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--text-secondary);
}

.message-row.user .message-name {
  text-align: right;
}

.message-bubble {
  padding: 12px 16px;
  border-radius: var(--radius);
  line-height: 1.65;
  font-size: 14px;
  word-wrap: break-word;
  overflow-wrap: break-word;
}

.message-row.assistant .message-bubble {
  background: var(--bg-asst-msg);
  border: 1px solid var(--border-light);
}

.message-row.user .message-bubble {
  background: var(--bg-user-msg);
  border: 1px solid rgba(212, 136, 43, 0.15);
}

/* Markdown rendered content */
.message-bubble p { margin-bottom: 10px; }
.message-bubble p:last-child { margin-bottom: 0; }
.message-bubble strong { font-weight: 600; color: var(--saffron-light); }
.message-bubble em { font-style: italic; }

.message-bubble ul, .message-bubble ol {
  margin: 8px 0;
  padding-left: 20px;
}

.message-bubble li {
  margin-bottom: 4px;
}

.message-bubble code {
  background: var(--code-bg);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 13px;
}

.message-bubble pre {
  background: var(--code-bg);
  padding: 12px;
  border-radius: var(--radius-sm);
  overflow-x: auto;
  margin: 8px 0;
}

.message-bubble pre code {
  background: none;
  padding: 0;
}

.message-bubble blockquote {
  border-left: 3px solid var(--saffron);
  padding-left: 12px;
  margin: 8px 0;
  color: var(--text-secondary);
}

/* Typing indicator */
.typing-indicator {
  display: flex;
  gap: 4px;
  padding: 4px 0;
}

.typing-dot {
  width: 7px;
  height: 7px;
  background: var(--text-muted);
  border-radius: 50%;
  animation: bounce 1.4s ease-in-out infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}

/* ======= Input Area ======= */
.input-area {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 16px 20px 20px;
  background: linear-gradient(transparent, var(--bg-primary) 30%);
}

.input-container {
  max-width: 768px;
  margin: 0 auto;
  position: relative;
}

.input-box {
  display: flex;
  align-items: flex-end;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--input-bg);
  padding: 10px 14px;
  transition: border-color var(--transition), box-shadow var(--transition);
  box-shadow: var(--shadow);
}

.input-box:focus-within {
  border-color: var(--saffron);
  box-shadow: 0 0 0 2px rgba(212, 136, 43, 0.15);
}

.input-textarea {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text-primary);
  font-family: var(--font-main);
  font-size: 14px;
  resize: none;
  max-height: 150px;
  min-height: 24px;
  line-height: 1.5;
  padding: 2px 0;
}

.input-textarea::placeholder {
  color: var(--text-muted);
}

.send-btn {
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 10px;
  background: var(--saffron);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-left: 8px;
  transition: all var(--transition);
}

.send-btn:hover { background: var(--saffron-light); transform: scale(1.05); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.send-btn svg {
  width: 16px;
  height: 16px;
}

.input-hint {
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 8px;
}

/* ======= Overlay for mobile sidebar ======= */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 90;
}

/* ======= Mobile responsive ======= */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    transform: translateX(-100%);
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .sidebar.open + .sidebar-overlay {
    display: block;
  }

  .mobile-menu-btn {
    display: flex;
  }

  .messages-container {
    padding-top: 56px;
  }

  .welcome-suggestions {
    grid-template-columns: 1fr;
  }

  .message-content {
    max-width: 90%;
  }

  .welcome-screen {
    padding-top: 60px;
  }
}

@media (max-width: 480px) {
  .welcome-title { font-size: 20px; }
  .input-area { padding: 10px 12px 14px; }
}
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon">&#x1F33F;</div>
        <div>
          <div class="brand-text">Ayurveda Vaidya</div>
          <div class="brand-sub">Diagnostic Assistant</div>
        </div>
      </div>
      <button class="new-chat-btn" onclick="startNewChat()">
        <span>+</span> New Consultation
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">Quick Actions</div>
      <button class="quick-action" onclick="sendQuickAction('Based on my conversation so far, can you recommend specific yoga asanas and kriyas for my condition?')">
        <span class="quick-action-icon">&#x1F9D8;</span> Recommend Asanas
      </button>
      <button class="quick-action" onclick="sendQuickAction('Can you help me determine my Prakriti (natural dosha constitution)? Please ask me the relevant questions.')">
        <span class="quick-action-icon">&#x2696;</span> Check My Dosha
      </button>
      <button class="quick-action" onclick="sendQuickAction('I would like a tongue analysis. I will describe what my tongue looks like in text: the coating, color, shape, and any marks.')">
        <span class="quick-action-icon">&#x1F445;</span> Tongue Analysis (Text)
      </button>
      <button class="quick-action" onclick="sendQuickAction('What diet and daily routine (Dinacharya) would you recommend for my current dosha imbalance?')">
        <span class="quick-action-icon">&#x1F957;</span> Diet & Routine
      </button>
    </div>

    <!-- Dosha Score Panel -->
    <div class="dosha-panel" id="doshaPanel">
      <div class="dosha-panel-title">Dosha Analysis</div>

      <div class="dosha-bar-group">
        <div class="dosha-bar-label">
          <span class="dosha-bar-name">Vata</span>
          <span class="dosha-bar-value" id="vataValue">0</span>
        </div>
        <div class="dosha-bar-track">
          <div class="dosha-bar-fill vata" id="vataBar" style="width: 0%"></div>
        </div>
      </div>

      <div class="dosha-bar-group">
        <div class="dosha-bar-label">
          <span class="dosha-bar-name">Pitta</span>
          <span class="dosha-bar-value" id="pittaValue">0</span>
        </div>
        <div class="dosha-bar-track">
          <div class="dosha-bar-fill pitta" id="pittaBar" style="width: 0%"></div>
        </div>
      </div>

      <div class="dosha-bar-group">
        <div class="dosha-bar-label">
          <span class="dosha-bar-name">Kapha</span>
          <span class="dosha-bar-value" id="kaphaValue">0</span>
        </div>
        <div class="dosha-bar-track">
          <div class="dosha-bar-fill kapha" id="kaphaBar" style="width: 0%"></div>
        </div>
      </div>

      <div class="dosha-dominant" id="doshaDominant"></div>
    </div>

    <div class="sidebar-footer">
      <button class="theme-toggle" onclick="toggleTheme()">
        <span id="themeIcon">&#x2600;</span>
        <span id="themeLabel">Light</span>
      </button>
      <span style="font-size:11px;color:var(--text-muted)">v1.0</span>
    </div>
  </aside>

  <!-- Mobile overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- Main Chat Area -->
  <main class="chat-main">
    <button class="mobile-menu-btn" onclick="toggleSidebar()">&#x2630;</button>

    <div class="chat-messages" id="chatMessages">
      <!-- Welcome screen or messages go here -->
    </div>

    <div class="input-area">
      <div class="input-container">
        <div class="input-box">
          <textarea
            class="input-textarea"
            id="userInput"
            placeholder="Describe your symptoms or ask a question..."
            rows="1"
            onkeydown="handleKeyDown(event)"
            oninput="autoResize(this)"
          ></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <div class="input-hint">Ayurveda Vaidya uses classical texts. Not a substitute for medical advice.</div>
      </div>
    </div>
  </main>
</div>

<script>
// ======= State =======
let sessionId = null;
let isStreaming = false;

const chatMessages = document.getElementById('chatMessages');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

// ======= Initialization =======
document.addEventListener('DOMContentLoaded', () => {
  loadTheme();
  showWelcomeScreen();
  userInput.addEventListener('input', () => {
    sendBtn.disabled = !userInput.value.trim() || isStreaming;
  });
});

// ======= Theme =======
function loadTheme() {
  const saved = localStorage.getItem('ayurveda-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeButton(saved);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('ayurveda-theme', next);
  updateThemeButton(next);
}

function updateThemeButton(theme) {
  document.getElementById('themeIcon').innerHTML = theme === 'dark' ? '&#x2600;' : '&#x1F319;';
  document.getElementById('themeLabel').textContent = theme === 'dark' ? 'Light' : 'Dark';
}

// ======= Sidebar (mobile) =======
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
}

// ======= Welcome Screen =======
function showWelcomeScreen() {
  chatMessages.innerHTML = `
    <div class="welcome-screen" id="welcomeScreen">
      <div class="welcome-icon">&#x1F33F;</div>
      <div class="welcome-title">Ayurveda Vaidya</div>
      <div class="welcome-sub">
        Your personal Ayurvedic diagnostic assistant, grounded in classical texts
        like Charaka Samhita, Sushruta Samhita, and Ashtanga Hridaya.
      </div>
      <div class="welcome-suggestions">
        <button class="suggestion-btn" onclick="startWithMessage('I have been experiencing digestive issues and bloating after meals')">
          &#x1F343; "I have digestive issues and bloating after meals"
        </button>
        <button class="suggestion-btn" onclick="startWithMessage('I have trouble sleeping and often feel anxious')">
          &#x1F319; "I have trouble sleeping and feel anxious"
        </button>
        <button class="suggestion-btn" onclick="startWithMessage('I want to understand my body constitution and dosha type')">
          &#x2696; "Help me understand my dosha type"
        </button>
        <button class="suggestion-btn" onclick="startWithMessage('I have skin rashes and feel hot and irritable')">
          &#x1F525; "I have skin rashes and feel irritable"
        </button>
      </div>
    </div>
  `;
}

// ======= Session Management =======
async function startSession() {
  try {
    const res = await fetch('/chat/start', { method: 'POST' });
    if (!res.ok) throw new Error(`Start failed: ${res.status}`);
    const data = await res.json();
    sessionId = data.session_id;
    return data.message;
  } catch (err) {
    console.error('Failed to start session:', err);
    return null;
  }
}

async function startNewChat() {
  sessionId = null;
  isStreaming = false;
  resetDoshaScores();
  showWelcomeScreen();
  userInput.value = '';
  userInput.style.height = 'auto';
  sendBtn.disabled = true;
  closeSidebar();
}

async function startWithMessage(msg) {
  userInput.value = msg;
  sendBtn.disabled = false;
  await sendMessage();
}

// ======= Message Rendering =======
function clearWelcome() {
  const welcome = document.getElementById('welcomeScreen');
  if (welcome) welcome.remove();
  // Ensure messages container exists — but never wipe existing messages
  if (!document.getElementById('messagesContainer')) {
    const mc = document.createElement('div');
    mc.className = 'messages-container';
    mc.id = 'messagesContainer';
    chatMessages.appendChild(mc);
  }
}

function getMessagesContainer() {
  let container = document.getElementById('messagesContainer');
  if (!container) {
    container = document.createElement('div');
    container.className = 'messages-container';
    container.id = 'messagesContainer';
    chatMessages.appendChild(container);
  }
  return container;
}

function addMessage(role, text) {
  clearWelcome();
  const container = getMessagesContainer();
  const row = document.createElement('div');
  row.className = `message-row ${role}`;

  const avatar = role === 'assistant' ? '&#x1F33F;' : '&#x1F464;';
  const name = role === 'assistant' ? 'Ayurveda Vaidya' : 'You';

  row.innerHTML = `
    <div class="message-avatar">${avatar}</div>
    <div class="message-content">
      <div class="message-name">${name}</div>
      <div class="message-bubble">${role === 'assistant' ? renderMarkdown(text) : escapeHtml(text)}</div>
    </div>
  `;

  container.appendChild(row);
  scrollToBottom();
  return row;
}

let streamMsgCounter = 0;

function addStreamingMessage() {
  clearWelcome();
  const container = getMessagesContainer();
  const row = document.createElement('div');
  row.className = 'message-row assistant';
  streamMsgCounter++;
  const bubbleId = 'streamBubble_' + streamMsgCounter;

  row.innerHTML = `
    <div class="message-avatar">&#x1F33F;</div>
    <div class="message-content">
      <div class="message-name">Ayurveda Vaidya</div>
      <div class="message-bubble" id="${bubbleId}">
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    </div>
  `;

  container.appendChild(row);
  scrollToBottom();
  return document.getElementById(bubbleId);
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    chatMessages.scrollTop = chatMessages.scrollHeight;
  });
}

// ======= Markdown Rendering (lightweight) =======
function renderMarkdown(text) {
  if (!text) return '';
  let html = escapeHtml(text);

  // Code blocks
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Blockquote
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  // Numbered lists
  html = html.replace(/(?:^|\n)((?:\d+\. .+\n?)+)/g, (match, list) => {
    const items = list.trim().split('\n').map(item =>
      '<li>' + item.replace(/^\d+\.\s*/, '') + '</li>'
    ).join('');
    return '<ol>' + items + '</ol>';
  });

  // Bullet lists
  html = html.replace(/(?:^|\n)((?:[-*] .+\n?)+)/g, (match, list) => {
    const items = list.trim().split('\n').map(item =>
      '<li>' + item.replace(/^[-*]\s*/, '') + '</li>'
    ).join('');
    return '<ul>' + items + '</ul>';
  });

  // Paragraphs
  html = html.replace(/\n\n+/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  html = '<p>' + html + '</p>';
  // Clean empty paragraphs
  html = html.replace(/<p>\s*<\/p>/g, '');
  // Don't nest block elements inside p
  html = html.replace(/<p>(<(?:ul|ol|pre|blockquote)[\s\S]*?<\/(?:ul|ol|pre|blockquote)>)<\/p>/g, '$1');

  return html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ======= Dosha Score Updates =======
function updateDoshaScores(scores, dominant) {
  if (!scores) return;

  const maxScore = Math.max(scores.vata || 0, scores.pitta || 0, scores.kapha || 0, 1);
  const scale = 100 / Math.max(maxScore, 10); // scale to percentage, min 10

  document.getElementById('vataValue').textContent = scores.vata || 0;
  document.getElementById('pittaValue').textContent = scores.pitta || 0;
  document.getElementById('kaphaValue').textContent = scores.kapha || 0;

  document.getElementById('vataBar').style.width = ((scores.vata || 0) * scale) + '%';
  document.getElementById('pittaBar').style.width = ((scores.pitta || 0) * scale) + '%';
  document.getElementById('kaphaBar').style.width = ((scores.kapha || 0) * scale) + '%';

  const domEl = document.getElementById('doshaDominant');
  if (dominant && dominant !== 'Unknown') {
    domEl.textContent = 'Dominant: ' + dominant;
  } else {
    domEl.textContent = '';
  }
}

function resetDoshaScores() {
  updateDoshaScores({ vata: 0, pitta: 0, kapha: 0 }, '');
}

// ======= Sending Messages =======
async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || isStreaming) return;

  closeSidebar();

  // Start session if needed
  if (!sessionId) {
    const openingMsg = await startSession();
    if (!openingMsg) {
      addMessage('assistant', 'Unable to connect to the server. Please ensure the API is running and try again.');
      return;
    }
    addMessage('assistant', openingMsg);
  }

  // Add user message
  addMessage('user', text);
  userInput.value = '';
  userInput.style.height = 'auto';
  sendBtn.disabled = true;
  isStreaming = true;

  // Try streaming first, fallback to non-streaming
  try {
    await streamResponse(text);
  } catch (err) {
    console.warn('Streaming failed, falling back:', err);
    try {
      await fallbackMessage(text);
    } catch (err2) {
      console.error('Fallback also failed:', err2);
      addMessage('assistant', 'I apologize, but I encountered an error. Please try again.');
    }
  }

  isStreaming = false;
  sendBtn.disabled = !userInput.value.trim();

  // Fetch updated dosha scores after response
  fetchDoshaScores();
}

async function streamResponse(text) {
  const res = await fetch('/chat/stream', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId, message: text }),
  });

  if (!res.ok) {
    throw new Error(`Stream failed: ${res.status}`);
  }

  const bubble = addStreamingMessage();
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let fullText = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    const chunk = decoder.decode(value, { stream: true });
    fullText += chunk;
    bubble.innerHTML = renderMarkdown(fullText);
    scrollToBottom();
  }

  // Final render
  if (fullText) {
    bubble.innerHTML = renderMarkdown(fullText);
  }
}

async function fallbackMessage(text) {
  const res = await fetch('/chat/message', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId, message: text }),
  });

  if (!res.ok) throw new Error(`Message failed: ${res.status}`);

  const data = await res.json();
  addMessage('assistant', data.response);
  updateDoshaScores(data.dosha_scores, data.dominant_dosha);
}

async function fetchDoshaScores() {
  if (!sessionId) return;
  try {
    const res = await fetch(`/chat/history/${sessionId}`);
    if (!res.ok) return;
    const data = await res.json();
    updateDoshaScores(data.dosha_scores, data.dominant_dosha);
  } catch (e) {
    // Silent fail for dosha fetch
  }
}

// ======= Quick Actions =======
async function sendQuickAction(msg) {
  closeSidebar();
  userInput.value = msg;
  sendBtn.disabled = false;
  await sendMessage();
}

// ======= Input Handling =======
function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!sendBtn.disabled) sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}
